services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_BOT_BASIC_ID: ${LINE_BOT_BASIC_ID}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID}
      LIFF_ID: ${LIFF_ID}
      LIFF_ID_APIKEY: ${LIFF_ID_APIKEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PARSE_MODEL: ${GEMINI_PARSE_MODEL}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL}
      APIKEY_ENC_KEY: ${APIKEY_ENC_KEY}
      PUBLIC_BASE: ${PUBLIC_BASE}
      LIFF_BASE: ${LIFF_BASE}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PORT: 3001
    ports:
      - "127.0.0.1:${SERVER_PORT}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  liff-app:
    build:
      context: ./liff-app
      args:
        VITE_API_BASE: ${PUBLIC_BASE}/api
        VITE_LIFF_ID: ${LIFF_ID}
        VITE_LIFF_ID_APIKEY: ${LIFF_ID_APIKEY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT}:80"

  landing:
    build:
      context: ./landing
    restart: unless-stopped
    ports:
      - "127.0.0.1:28081:80"

volumes:
  db-data:

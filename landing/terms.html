      <li>不得進行逆向工程、自動化大量呼叫</li>
      <li>不得上傳侵權或違法內容</li>
    </ul>

    <h2>3. AI 辨識準確度</h2>
    <p>AI 解析結果僅供參考，使用者有責任驗證並修正最終帳目。</p>

    <h2>4. 服務變更與終止</h2>
    <p>本服務保留隨時調整功能、配額或終止服務之權利，重大變更將提前通知。</p>

    <h2>5. 準據法</h2>
    <p>本條款依中華民國法律解釋。任何爭議以台灣台北地方法院為第一審管轄法院。</p>
